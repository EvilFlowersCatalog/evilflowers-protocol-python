[tool.poetry]
name = "evilflowers-protocol"
version = "0.2.0"
description = "EvilFlowers Catalog REST API client (stdlib urllib) and Pydantic models generated from the OpenAPI spec."
authors = ["EvilFlowers Team <dev@evilflowers.org>"]
license = "MIT"
readme = "README.md"
packages = [{ include = "evilflowers_protocol" }]
homepage = "https://github.com/EvilFlowersCatalog/evilflowers-protocol-python"
repository = "https://github.com/EvilFlowersCatalog/evilflowers-protocol-python"

[tool.poetry.dependencies]
python = "^3.12"
pydantic = "^2.8"
pydantic2md = "^0.1.0"

[tool.poetry.group.dev.dependencies]
datamodel-code-generator = { version = "^0.25.2", extras = ["http"] }
black = "^24.0"
pytest = "^8.0"
ruff = ">=0.9"
mypy = "^1.14"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

# `poetry run datamodel-codegen` (and the generate-client workflow) read this table.
# Every output-shaping option is explicit: generator defaults change between releases
# (0.25 emits pydantic v1 unless told otherwise), and the overlay in forms.py relies on v2.
[tool.datamodel-codegen]
input = "openapi/openapi.yaml"
input-file-type = "openapi"
output = "evilflowers_protocol/schema.py"
output-model-type = "pydantic_v2.BaseModel"
target-python-version = "3.12"
use-standard-collections = true
use-union-operator = true
field-constraints = true
reuse-model = true
disable-timestamp = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["evilflowers_protocol", "tests"]

# Generated by datamodel-codegen on every spec sync; never hand-edited.
[[tool.mypy.overrides]]
module = "evilflowers_protocol.schema"
ignore_errors = true
implicit_reexport = true

[[tool.mypy.overrides]]
module = "pydantic2md"
ignore_missing_imports = true

# Docs CLI predates the typing bar.
[[tool.mypy.overrides]]
module = "evilflowers_protocol.cli"
disallow_untyped_defs = false
disallow_untyped_calls = false
